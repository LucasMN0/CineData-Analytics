[project]
name = "cinedata-analytics"
version = "0.1.0"
description = "Agent IA para análises de filmes usando PydanticAI"
requires-python = ">=3.12"
authors = [{name = "CineData Team"}]

dependencies = [
    "pydantic-ai[openrouter]>=0.0.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=3.30",
    "ipython>=8.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ruff>=0.4.0",
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinedata"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
